# PC-504 — CI pipeline
# Runs backend (pytest) and frontend (lint, typecheck, test, build) checks on
# every PR and push to main.  Merge is blocked if any step fails.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest tests/ --tb=short -v

  # ── Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # NOTE: `npm install`, not `npm ci`, is intentional. The committed
      # package-lock.json is generated on the Windows dev machine and omits the
      # Linux-only optional transitive deps (@emnapi/* — unrs-resolver's wasm
      # fallback), so strict `npm ci` fails on this Linux runner with
      # "missing @emnapi/... from lock file". `npm install` reconciles those
      # platform optionals against the lockfile and installs cleanly. To switch
      # back to `npm ci`, regenerate the lockfile on Linux and commit it.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ── End-to-end (Playwright) ──────────────────────────────────────────
  # PC-505 — one golden-path browser test. Playwright's webServer boots the
  # FastAPI backend (in-memory store, no Supabase env) and a production Next.js
  # build, then drives Chromium through upload -> build graph -> run -> download
  # and asserts the ZIP contents. Needs both Node and Python on one runner.
  e2e:
    name: E2E (Playwright golden path)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `npm install`, not `npm ci` — see the note in the frontend job above.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run golden-path E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
